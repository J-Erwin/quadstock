# QuadStock
# Edit while stopped, then restart.
# /qm config check validates without applying.
# Admin guide: docs/admin-guide.md
# Market/ticker IDs are permanent once saved.
version: 1
# Optional command default; omit to use the first configured industry.
default-ticker: AGRI
# Physical market display anchors. An empty list disables new registrations.
# Existing admin files may omit this section and use these defaults.
# Registered blocks use right-click for their market screen, including containers if allowed.
displays:
  max-displays: 256
  view-distance: 32
  allowed-anchor-materials:
    - STONE
    - STONE_BRICKS
    - POLISHED_ANDESITE
    - DEEPSLATE_BRICKS
    - QUARTZ_BLOCK
    - SMOOTH_QUARTZ
    - BRICKS
    - OAK_PLANKS
    - SPRUCE_PLANKS
    - DARK_OAK_PLANKS
    - IRON_BLOCK
    - GOLD_BLOCK
    - COPPER_BLOCK
    - OAK_SIGN
    - OAK_WALL_SIGN
    - OAK_HANGING_SIGN
    - OAK_WALL_HANGING_SIGN
    - SPRUCE_SIGN
    - SPRUCE_WALL_SIGN
    - SPRUCE_HANGING_SIGN
    - SPRUCE_WALL_HANGING_SIGN
# Rolling price history in market months (28 market days each); supported range: 1–12.
# Increasing preserves existing history; lowering prunes older samples when applied.
# Existing files that omit this section use 12 months without being rewritten.
history:
  retention-market-months: 12
ui:
  refresh-seconds: 2
trading:
  enabled: true
  quote-market-minutes: 60
  max-shares-per-order: 10000
reports:
  enabled: true
  interval-market-hours: 24
  alert-cooldown-market-hours: 2
  news-headline-limit: 4
commerce:
  enabled: true
# 0 disables influence.
# 1 applies the full max-outlook-percent cap below.
  influence-scale: 1.0
# Maximum positive reference-outlook adjustment, NOT an immediate price increase (0–100%).
  max-outlook-percent: 2.0
# All four requirements must be met within the trailing market day, after learning.
  minimum-buyers: 3
  minimum-sellers: 2
  minimum-participants: 4
  minimum-pairs: 3
# Global economic event defaults; industries may override any key under their own events section.
# Volatility remains a random-noise multiplier, separate from these percentages.
events:
  max-move-percent-per-market-hour: 0.5
  positive-weight: 4
  negative-weight: 4
  neutral-weight: 2
  positive-impact-min-percent: 8
  positive-impact-max-percent: 12
  negative-impact-min-percent: 8
  negative-impact-max-percent: 12
  duration-min-market-hours: 18
  duration-max-market-hours: 36
  gap-min-market-hours: 12
  gap-max-market-hours: 36
  special:
    enabled: true
    chance-percent: 1
    positive-weight: 1
    negative-weight: 1
    positive-impact-min-percent: 20
    positive-impact-max-percent: 40
    negative-impact-min-percent: 20
    negative-impact-max-percent: 40
    duration-min-market-hours: 12
    duration-max-market-hours: 36
    cooldown-market-days: 14
    response-half-life-market-hours: 3
    max-move-percent-per-market-hour: 2
markets:
  OVERWORLD:
    name: Overworld Exchange
# Optional per-industry share-supply and max-shares-per-player:
# unlimited (default), or a whole number >= 0. Zero blocks new purchases.
# Example: share-supply: 100000 and max-shares-per-player: 1000.
