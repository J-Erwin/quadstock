name: Build and release

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadstock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release policy
        run: python3 -m unittest discover -s .github/tests -v
      - name: Select version and check release ancestry
        id: version
        run: python3 .github/scripts/release_policy.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build, test, format-check and Javadoc
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash gradlew --no-daemon clean build -PbuildVersion="$BUILD_VERSION"
          git diff --exit-code
      - name: Collect release files
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp "build/libs/quadstock-${BUILD_VERSION}.jar" dist/
          cp "build/distributions/quadstock-${BUILD_VERSION}-source.zip" dist/
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cd dist
          sha256sum ./*.jar ./*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: quadstock-${{ steps.version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck main ancestry before publication
        env:
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 .github/scripts/release_policy.py
      - uses: actions/download-artifact@v8
        with:
          name: quadstock-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --target main \
            --title "QuadStock $RELEASE_TAG" --generate-notes \
            ./*.jar ./*.zip LICENSE THIRD_PARTY_NOTICES.md SHA256SUMS
